name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Odin compiler
        run: |
          winget install --id OdinLang.Odin --silent --accept-package-agreements --accept-source-agreements
      - name: Check, test, and asset policy
        shell: pwsh
        run: |
          ./odin/build.ps1 check
          ./odin/build.ps1 policy
          ./odin/build.ps1 test
