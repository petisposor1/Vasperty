name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          winget install --id OdinLang.Odin --silent --accept-package-agreements --accept-source-agreements
      - name: Check, asset policy, and test suite
        shell: pwsh
        run: |
          ./build.ps1 check
          ./build.ps1 policy
          ./build.ps1 test
